[[finding]]
metric = "energy-efficiency"
value = 4.7e15
unit = "FLOP J^-1"
conditions = "Geometric-mean estimate of the maximum floating point operations per joule for CMOS microprocessors, counted in FP4 operations, combining transistor switching, interconnect capacitance and leakage. An estimate of a ceiling, not a current value."
quote = "Combining these yields a geometric mean estimate of 4.7e15 FP4/J for the maximum CMOS energy efficiency, roughly two hundred-fold more efficient than current microprocessors."
