name = "Beyond-CMOS logic"
statement = """
Logic that performs a computation at far less energy per operation than silicon CMOS can, by
steeper switches, reversible or adiabatic operation, or superconducting and other devices, down
toward the thermodynamic limit.
"""
scope = """
In scope: devices and circuits for logic operations, measured by energy per operation at the device
and with cooling and power delivery included. Out of scope: moving data between memory and
processor, covered by computing/low-energy-data-movement; removing the heat, covered by
enablers/heat-removal; quantum logic, covered by the quantum domain.
"""
status = "proposed"
sdgs = [9]
search_terms = ["energy per operation logic device femtojoule", "reversible computing adiabatic logic", "superconducting logic energy", "steep-slope transistor tunnel FET negative capacitance"]
curators = []

[[metric]]
id = "op-energy"
metric = "energy-per-operation"
headline = true
conditions = "Energy dissipated per logic operation at the device. No sourced current value yet; see the report."

[metric.limit]
value = 2.87e-21
basis = "Landauer bound for erasing one bit at 300 K, kT ln 2 with k = 1.380649e-23 J/K, about 2.87e-21 J. It bounds logically irreversible operations; reversible logic can in principle go lower per operation, at the price of speed."
