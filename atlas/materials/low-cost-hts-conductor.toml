name = "Low-cost high-temperature superconducting conductor"
statement = """
High-temperature superconducting tape (REBCO) that carries kiloamperes at fusion-magnet
conditions at a price per kA-m that lets magnets of hundreds of kilometres of tape be built.
"""
scope = """
In: REBCO coated conductors and their manufacturing cost. Out: low-temperature superconductors
such as Nb3Sn and NbTi, and the cabling and magnet engineering built on the tape.
"""
status = "scoping"
readiness_scale = "mrl"
sdgs = [7, 9]
search_terms = ["REBCO coated conductor cost", "HTS tape price per kA-m", "REBCO manufacturing scale-up"]
curators = []
last_reviewed = 2026-10-04

[[metric]]
id = "conductor-cost"
metric = "conductor-cost"
headline = true
conditions = "REBCO tape at 20 K and 20 T, field parallel to c; derived from price per metre and critical current."

[metric.current]
value = 100
