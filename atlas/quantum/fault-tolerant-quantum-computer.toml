[[gap]]
id = "physical-error"
title = "Physical error rates uniform across the array"
description = """
Single pairs of superconducting qubits reach two-qubit gate fidelity of 99.94% (error 6e-4) with
stability over 24 days, but a million-qubit machine needs every pair near that level at once, with
leakage and crosstalk held down. The Willow memory ran at 0.143% logical error per cycle at
distance 7, short of the target by about nine orders of magnitude. Closing it means both lower
physical error and larger code distance on many more qubits.
"""
metric = "logical-error"
type = "engineering"
layer = "device"
severity = "high"
status = "active"
evidence = ["google2024quantum", "lin2025days"]
search_terms = ["two-qubit gate fidelity 99.9 superconducting", "fluxonium gate", "leakage suppression"]

