[[gap]]
id = "correlated-errors"
title = "Correlated errors from cosmic rays and radioactivity"
description = """
Muons and gamma rays create quasiparticle bursts that cause correlated errors across a chip, which
error correction cannot absorb. A measurement on a 63-qubit processor separated the contributions
of muons and gamma rays. Back-side phonon downconversion cut correlated poisoning by two orders of
magnitude on three-qubit chips; it has not been shown on a million-qubit array.
"""
metric = "logical-error"
type = "scientific-unknown"
layer = "device"
