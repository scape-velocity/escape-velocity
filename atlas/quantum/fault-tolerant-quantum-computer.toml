name = "Fault-tolerant quantum computer"
statement = """
A quantum computer that runs algorithms of practical value, with logical error rates low enough
that the answer can be trusted. It does this by encoding each logical qubit in many noisy physical
qubits and correcting errors faster than they accumulate.
"""
scope = """
In scope: the full machine that error-corrects a computation, built here from physical qubits, a
real-time decoder, cryogenic control and refrigeration, and links between modules. Out of scope:
noisy intermediate-scale machines without error correction, quantum sensors and quantum networks
for their own sake. The decoder is covered by quantum/real-time-qec-decoder and the module links
by quantum/quantum-interconnect.
"""
status = "mapped"
readiness = 4
readiness_evidence = ["google2024quantum"]
readiness_note = "A distance-7 surface-code memory below threshold has been shown in the laboratory; no logical algorithm of practical value has run, and the wiring, refrigeration and decoding for a million-qubit machine are not built."
sdgs = [9]
search_terms = ["quantum error correction below threshold", "logical qubit surface code", "fault-tolerant quantum computing resource estimate"]
curators = []
last_reviewed = 2026-10-04
alan_machine = [{ page = "chapters/quantum-alan", title = "The quantum Alan" }, { page = "building-alan/quantum-hardware", title = "Building Alan: quantum hardware" }]

[[requires]]
technology = "quantum/real-time-qec-decoder"
why = "Every error-correction cycle needs its syndromes decoded before the next logical operation that depends on them."
metric = "decoder-latency"
value = 1e-5
need = "Reaction time of 10 microseconds, the figure assumed in the RSA-2048 resource estimate (gidney2025how)."

[[requires]]
technology = "enablers/dilution-refrigeration"
why = "Superconducting qubits operate at about 10 mK, and every control line and amplifier adds heat to that stage."
metric = "cooling-power"
need = "Enough cooling power, in one cryostat or several linked, for the heat load of up to a million physical qubits and their wiring."

[[requires]]
technology = "enablers/cryogenic-control-electronics"
why = "One coaxial line per qubit does not scale to a million qubits; control and readout electronics must sit in the cold."

[[requires]]
technology = "quantum/quantum-interconnect"
why = "A machine of up to a million qubits is unlikely to fit in one cryostat, so modules must be linked by quantum channels."

