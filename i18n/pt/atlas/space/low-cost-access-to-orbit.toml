text = "Acesso de baixo custo à órbita"

[[text]]
path = "statement"
source = "7af4534e64"
text = """
Colocar carga útil em órbita terrestre baixa a um custo por quilograma baixo o bastante para que a
massa deixe de ser o principal limite do que se constrói no espaço.
"""

[[text]]
path = "scope"
source = "3624eb7917"
text = """
Dentro: o custo por quilograma do lançamento à órbita terrestre baixa, por sistemas de lançamento
reutilizáveis ou de outro modo mais baratos. Fora: o que se constrói ou se mantém vivo em órbita
(space/closed-loop-life-support) e o transporte espacial além da órbita terrestre baixa.
"""

[[text]]
path = "metric[launch-cost].conditions"
source = "7b24ca744a"
text = "Custo médio de enviar um quilograma à órbita, todos os lançamentos do ano."

[[text]]
