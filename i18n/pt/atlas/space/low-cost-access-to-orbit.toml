source = "8bdc2b8f15"
text = """
Uma média sobre um conjunto de dados de todos os lançamentos, portanto abaixo do preço de tabela de
veículos de baixo custo para algumas missões e acima dele para outras.
"""

[[text]]
path = "metric[launch-cost].target.rationale"
source = "1692942f4c"
text = """
A projeção de estimativa central do mesmo estudo de curva de experiência para 2040; é uma previsão
a partir de um ajuste pela lei de Wright, não uma meta definida por uma agência, e é usada aqui
como o próximo marco.
"""

[[text]]
path = "gap[reusability].title"
source = "d830fd8950"
text = "Reutilização de todo o sistema de lançamento"

[[text]]
path = "gap[reusability].description"
source = "bbac19dcda"
text = """
Primeiros estágios reutilizáveis reduziram o custo de lançamento, e fornecedores em vários
continentes planejam sistemas reutilizáveis. O custo por quilograma cai com a carga útil acumulada
lançada, seguindo uma curva de aprendizado, então novas reduções dependem de reutilização em ritmo
maior e com mais do veículo recuperado.
"""

[[text]]
path = "gap[market-and-debris].title"
source = "6a5cf19b25"
text = "Estrutura de mercado e detritos orbitais podem desacelerar a queda"

[[text]]
path = "gap[market-and-debris].description"
source = "92332dd1ef"
text = """
O estudo que ajusta a curva de aprendizado alerta que mudanças geopolíticas, possível comportamento
monopolista nos mercados de lançamento comercial e o problema crescente dos detritos orbitais podem
moderar as reduções de custo.
"""
