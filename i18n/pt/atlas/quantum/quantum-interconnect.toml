[[text]]
path = "statement"
source = "862221db65"
text = """
Canais que transportam estados quânticos ou emaranhamento entre processadores quânticos em
criostatos ou módulos separados, para que uma máquina possa crescer além do que um criostato
comporta.
"""

[[text]]
path = "scope"
source = "13f27a5fa5"
text = """
No escopo: enlaces entre módulos de uma máquina supercondutora, como a transdução de micro-ondas
para óptico e a distribuição óptica de emaranhamento, e sua fidelidade e taxa. Fora do escopo:
redes quânticas de longa distância e comunicação como fins em si, e acopladores no chip dentro de
um módulo.
"""

