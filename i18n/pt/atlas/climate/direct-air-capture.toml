source = "a5d4ede00f"
text = """
Usinas que removem CO2 do ar ambiente e o armazenam de forma duradoura, a um custo baixo o bastante
para remover gigatoneladas por ano.
"""

[[text]]
path = "scope"
source = "2763d6ddf6"
text = """
Dentro: captura de CO2 do ar por sorventes ou solventes, com transporte e armazenamento geológico.
Fora: captura em fontes pontuais, remoção biológica e mineral, e o próprio local de armazenamento
(climate/geologic-co2-storage).
"""

[[text]]
path = "requires[materials/low-cost-co2-sorbents].why"
source = "fd6be090b7"
text = """
O sorvente define a capacidade de captura, a energia de regeneração e grande parte do custo da
usina.
"""

[[text]]
path = "requires[climate/geologic-co2-storage].why"
source = "ca6723d572"
text = """
A remoção só conta se o CO2 ficar fora do ar por séculos; o armazenamento também é parte do custo
por tonelada.
"""

[[text]]
path = "gap[cost].title"
