text = "O custo projetado fica na casa das centenas de USD por tonelada"

[[text]]
path = "gap[cost].description"
source = "6cc3902a53"
text = """
Estimativas de projeto e de curva de aprendizado põem o custo nivelado de captura na casa das
centenas de USD por tonelada: 94 a 232 USD/t para uma usina projetada de KOH aquoso (só captura, um
projeto e não uma usina em operação), e 341 a 374 USD/t de CO2 removido líquido, com transporte e
armazenamento, a 1 Gt-CO2 por ano de capacidade acumulada. Nenhuma fonte encontrada para o custo de
uma usina em operação hoje. Fechar a lacuna exige sorventes mais baratos, menor energia de
regeneração e armazenamento mais barato.
"""
