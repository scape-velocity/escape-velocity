source = "d706ec64d0"
text = """
Muitos componentes ópticos, como guias de onda, moduladores, lasers e detectores, fabricados juntos
em um único chip com baixa perda, a um custo que permita volume.
"""

[[text]]
path = "scope"
source = "61c742382d"
text = """
No escopo: circuitos fotônicos integrados, como as plataformas de nitreto de silício, silício e
III-V, e sua perda, a integração de fontes de luz e detectores, e a fabricação. Fora do escopo: os
sistemas que os usam, cobertos por quantum/quantum-interconnect e
computing/low-energy-data-movement.
"""

