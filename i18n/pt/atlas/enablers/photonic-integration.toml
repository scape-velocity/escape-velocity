[[text]]
path = "gap[low-loss-with-active-devices].title"
source = "aaf2253b14"
text = "Baixa perda e dispositivos ativos em um único processo"

[[text]]
path = "gap[low-loss-with-active-devices].description"
source = "e06cc5d7a2"
text = """
O nitreto de silício dá a menor perda em guias de onda, e a integração de materiais III-V e de
silício tornou possíveis circuitos de nitreto em grande escala com lasers e detectores. Perda
ultrabaixa foi alcançada em um processo sem recozimento a no máximo 250 C, compatível com as etapas
de back-end do CMOS; manter essa perda enquanto lasers, moduladores e detectores dividem o chip, em
volume, é o problema em aberto.
"""
