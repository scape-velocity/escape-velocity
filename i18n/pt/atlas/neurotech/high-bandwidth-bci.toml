[[text]]
path = "statement"
source = "e2b842ad17"
text = """
Uma interface implantada que permite a uma pessoa com paralisia comunicar-se perto da velocidade de
uma conversa natural, de forma confiável, com um dispositivo que funcione por anos. Esta entrada
mapeia pesquisa; não é aconselhamento médico.
"""

[[text]]
path = "scope"
source = "ec7f87155c"
text = """
Dentro: interfaces intracorticais e outras implantadas que decodificam fala ou movimento tentados
em texto, som ou controle. Fora: interfaces não invasivas e terapias de estimulação neural. Os
eletrodos de registro são tratados em neurotech/long-lived-neural-electrodes.
"""

[[text]]
path = "requires[neurotech/long-lived-neural-electrodes].why"
source = "4c2c491435"
text = """
A decodificação depende de registros de eletrodos implantados que precisam continuar funcionando
por anos.
"""

[[text]]
path = "requires[ai/energy-efficient-inference].why"
source = "1197b32f4b"
text = """
A decodificação roda uma rede neural sobre o sinal neural; rodá-la em um dispositivo vestível ou
implantado exige pouca energia por inferência.
"""

[[text]]
path = "metric[speech-rate].conditions"
