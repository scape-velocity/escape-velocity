# The terms of the atlas in Portuguese (Brazil). A translator uses these words for these terms, so
# that one English term reads the same on every page and in the interface (web/src/i18n/pt.json).
# A change is proposed in a translation pull request and approved by the language maintainers.
#
# Fields:
#   en     the English term
#   text   the Portuguese term
#   note   when to use it, or why this word and not another
#
# Conventions that are not terms:
#   - Numbers, units and dates stay as the English writes them, except the decimal mark, which is
#     a comma (1.5 becomes 1,5). Thousands stay grouped by a space, as in SI. tools/check.py
#     compares the digits of each translation with its English.
#   - Names stay in their language: Escape Velocity, The Alan Machine, the titles of papers and
#     journals, the names of institutions and of facilities.
#   - Quotes from a source are never translated; they are evidence (decision 0006).
#   - GitHub terms stay in English: pull request, issue, fork, commit.

