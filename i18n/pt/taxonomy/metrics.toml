[[text]]
path = "metric[two-qubit-gate-infidelity].name"
source = "4c755b8300"
text = "Infidelidade de porta de dois qubits"

[[text]]
path = "metric[two-qubit-gate-infidelity].meaning"
source = "ee884da0b9"
text = """
Infidelidade média de uma porta de dois qubits, 1 - F_avg, medida por benchmarking aleatorizado ou
benchmarking aleatorizado intercalado. Uma infidelidade de processo (de Pauli), como a que o
benchmarking de ciclo ou de entropia cruzada relata, é convertida por r_avg = d r_process / (d + 1)
= 0,8 r_process para d = 4, e a ficha diz isso
"""

