source = "f01da46253"
text = "Eficiência energética computacional"

[[text]]
path = "metric[energy-efficiency].meaning"
source = "fc73735951"
text = """
Operações de ponto flutuante por joule de um sistema completo, o mesmo que FLOP/s por watt, na
