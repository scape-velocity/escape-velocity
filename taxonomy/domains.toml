# The domains of the atlas. Every technology belongs to exactly one domain, the one whose community
# would curate it. Dependencies cross domains freely.
#
# Fields:
#   id                lowercase words joined by hyphens; the folder atlas/<id>/
#   name, summary
#   readiness_scale   default scale for the domain's technologies (taxonomy/readiness-scales.toml)
#   openalex_fields   OpenAlex field ids (https://openalex.org/fields/<id>) the domain draws on
#   arxiv             arXiv categories the scout searches by default (empty when the field rarely
#                     uses arXiv)
#   pubmed            true when the scout should also search PubMed and ClinicalTrials.gov
#   sdgs              UN Sustainable Development Goals the domain serves most directly
#
# A new domain needs a decision record: domains are the top of the navigation and change rarely.

[[domain]]
id = "computing"
name = "Computing"
summary = "Classical information processing: logic, memory and data movement after the end of transistor scaling."
readiness_scale = "trl"
openalex_fields = [17, 22]
arxiv = ["cs.AR", "cs.ET", "physics.app-ph"]
pubmed = false
sdgs = [9]

