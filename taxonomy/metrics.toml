# The metrics technologies may report. A new metric is added here in the same pull request that
# first uses it. One metric, one meaning, across every domain.
#
# Fields:
#   id          lowercase words joined by hyphens
#   name        the term the literature of the field uses
#   meaning
#   unit        plain text, SI where one exists (J, s, kWh m^-3, USD t^-1, %)
#   direction   "lower" or "higher": which way is better
#   scale       "log" when values span orders of magnitude, and the gap is reported in orders of
#               magnitude; "linear" for bounded quantities such as percentages, reported as a difference.
#               A percentage that spans orders of magnitude, such as a hit rate, is "log"
#   alan_machine  the metric's name in The Alan Machine's data/metrics.toml, when the book uses it too
#
# A metric depends on how it is measured. Each value records its conditions in the evidence card.

[[metric]]
id = "energy-per-operation"
name = "Energy per operation"
meaning = "Energy dissipated per logic operation, measured at the device"
unit = "J"
direction = "lower"
scale = "log"
alan_machine = "energy_per_operation"

[[metric]]
id = "wall-plug-energy-per-operation"
name = "Wall-plug energy per operation"
meaning = "Energy per logic operation drawn from the grid, including cooling and power delivery"
unit = "J"
direction = "lower"
scale = "log"
alan_machine = "wall_plug_energy_per_operation"

[[metric]]
id = "energy-efficiency"
name = "Computing energy efficiency"
meaning = "Floating-point operations per joule for a whole system, the same as FLOP/s per watt, at the arithmetic precision stated in the conditions (FP64 for the Green500; FP16, FP8 or FP4 for AI accelerators)"
unit = "FLOP J^-1"
direction = "higher"
scale = "log"

[[metric]]
id = "energy-per-token"
name = "Energy per token"
meaning = "Energy drawn per generated token in language model inference, as defined by the source. The number belongs to one of three measurement boundaries, and the conditions of the value say which: the chip or accelerator alone; the system, as power at the plug (MLPerf Power measures full system power with a SPEC-approved power analyzer read through the Power-Thermal Daemon, PTD, arXiv:2410.12032); or the facility, the system times the power usage effectiveness of the data center (PUE, ISO/IEC 30134-2:2026). Numbers from different boundaries are not comparable"
unit = "J"
direction = "lower"
scale = "log"
alan_machine = "energy_per_token"

[[metric]]
id = "error-rate"
name = "Error rate"
meaning = "Errors per operation, for a component with no more specific metric"
unit = "1"
direction = "lower"
scale = "log"
alan_machine = "error_rate"

[[metric]]
id = "two-qubit-gate-infidelity"
name = "Two-qubit gate infidelity"
meaning = "Average gate infidelity of a two-qubit gate, 1 - F_avg, as measured by randomized or interleaved randomized benchmarking. A process (Pauli) infidelity, as cycle or cross-entropy benchmarking report, is converted with r_avg = d r_process / (d + 1) = 0.8 r_process for d = 4, and the card says so"
unit = "1"
direction = "lower"
scale = "log"
alan_machine = "error_rate"

[[metric]]
id = "logical-error-per-cycle"
name = "Logical error per cycle"
meaning = "Probability that an error-corrected logical qubit fails in one round of error correction"
unit = "1"
direction = "lower"
scale = "log"

[[metric]]
id = "physical-qubits"
name = "Physical qubits"
meaning = "Number of physical qubits operated together in one device"
unit = "qubit"
direction = "higher"
scale = "log"

[[metric]]
id = "decoder-latency"
name = "Decoder latency"
meaning = "Time from the end of a syndrome measurement to the decoder's correction, in real-time decoding"
unit = "s"
direction = "lower"
scale = "log"

[[metric]]
id = "cooling-power"
name = "Cooling power"
meaning = "Heat a refrigerator can remove at the stated temperature"
unit = "W"
direction = "higher"
scale = "log"

[[metric]]
id = "net-removal-cost"
name = "Levelized cost of net CO2 removal"
meaning = "Levelized cost per tonne of CO2 removed from the atmosphere and durably stored, net of the life-cycle emissions of capture, energy, transport and storage"
unit = "USD t^-1"
direction = "lower"
scale = "log"

[[metric]]
id = "capture-cost"
name = "Levelized cost of CO2 capture"
meaning = "Levelized cost per tonne of CO2 captured, before transport and storage and without netting out the emissions of the process. Lower than the net removal cost of the same plant"
unit = "USD t^-1"
direction = "lower"
scale = "log"

[[metric]]
id = "specific-energy-consumption"
name = "Specific energy consumption"
meaning = "Energy used to produce one cubic metre of fresh water"
unit = "kWh m^-3"
direction = "lower"
scale = "log"

[[metric]]
id = "launch-cost"
name = "Launch cost"
meaning = "Price or cost to place one kilogram of payload in low Earth orbit"
unit = "USD kg^-1"
direction = "lower"
scale = "log"

[[metric]]
id = "scientific-gain"
name = "Scientific gain (Q_sci)"
meaning = "Fusion energy released divided by the heating energy absorbed by the plasma or, in inertial confinement, by the driver energy delivered to the target (the target gain). Scientific breakeven is Q_sci = 1; it leaves out the energy drawn from the grid to run the drivers, heating and magnets"
unit = "1"
direction = "higher"
scale = "log"

[[metric]]
id = "sensitivity"
name = "Sensitivity"
meaning = "Share of people with the condition whom the test detects"
unit = "%"
direction = "higher"
scale = "linear"

[[metric]]
id = "specificity"
name = "Specificity"
meaning = "Share of people without the condition whom the test correctly clears"
unit = "%"
direction = "higher"
scale = "linear"

[[metric]]
id = "communication-rate"
name = "Communication rate"
meaning = "Words per minute a person communicates through an interface, with the vocabulary size and the word error rate stated in the conditions; across modalities the field also reports the information transfer rate in bits per minute"
unit = "words min^-1"
direction = "higher"
scale = "log"

[[metric]]
id = "experimental-hit-rate"
name = "Experimental hit rate"
meaning = "Share of designed molecules that meet the stated success criterion, such as binding the target below a stated affinity, when tested experimentally"
unit = "%"
direction = "higher"
scale = "log"

[[metric]]
id = "conductor-cost"
name = "Conductor cost"
meaning = "Price of a conductor per kiloampere of current carried over one metre, at the stated temperature and field"
unit = "USD kA^-1 m^-1"
direction = "lower"
scale = "log"

[[metric]]
id = "nitrogen-derived-from-atmosphere"
name = "Nitrogen derived from the atmosphere (%Ndfa)"
meaning = "Share of a plant's nitrogen that comes from biological fixation of atmospheric N2, with the measurement method (15N isotope dilution, 15N natural abundance, ureide or N difference) stated in the conditions"
unit = "%"
direction = "higher"
scale = "linear"

[[metric]]
id = "energy-per-bit"
name = "Energy per bit moved"
meaning = "Energy to move one bit between memory and processor, or between chips, including the interface on both ends"
unit = "J"
direction = "lower"
scale = "log"

[[metric]]
id = "heat-flux"
name = "Heat flux removed"
meaning = "Heat a cooling solution removes per unit area of the device surface, at the stated temperature rise"
unit = "W m^-2"
direction = "higher"
scale = "log"

[[metric]]
id = "sequencing-cost"
name = "Cost per human genome"
meaning = "Cost to sequence one human genome at about 30-fold coverage, as defined by the source"
unit = "USD"
direction = "lower"
scale = "log"

[[metric]]
id = "waveguide-loss"
name = "Waveguide propagation loss"
meaning = "Optical power lost per unit length in an integrated waveguide, at the stated wavelength and geometry"
unit = "dB m^-1"
direction = "lower"
scale = "log"
