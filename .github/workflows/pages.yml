name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily, so the priorities page shows a fresh vote count (decision 0016).
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  discussions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the atlas
        run: python3 tools/check.py
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the export and llms.txt
        run: python3 tools/build_site.py
      # A failed count must not hold back the atlas: the site is published without a ranking.
      - name: Count the priority votes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/priorities.py count --out _site/priorities.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the explorer's dependencies
        working-directory: web
        run: npm ci
      - name: Build the explorer
        working-directory: web
        env:
          ATLAS_JSON: ../_site/atlas.json
          PRIORITIES_JSON: ../_site/priorities.json
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Put the explorer next to the data files
        run: cp -R web/out/. _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
