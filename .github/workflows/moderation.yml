name: Moderation

# Checks that someone who curates or moderates what a pull request changes has approved it, and
# asks them for a review (GOVERNANCE.md). The result is the commit status "moderation", required on
# main.
#
# pull_request_target and workflow_run run the main branch's version of this file and of
# tools/moderation.py, with a token that can write statuses and comments even for pull requests
# from forks. That is safe only because nothing from the pull request runs: its TOML files are
# fetched through the API and parsed as data.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    # A review re-evaluates the pull request. A review on a pull request from a fork gets a
    # read-only token, so review-submitted.yml only wakes this workflow.
    workflows: ["Review submitted"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: moderation-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -z "$NUMBER" ]; then
            NUMBER=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" --jq '.[0].number // empty')
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fetch the pull request as data
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          mkdir -p .moderation/head
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" > .moderation/pr.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" --jq '.[] | tojson' > .moderation/files.jsonl
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/reviews" --jq '.[] | tojson' > .moderation/reviews.jsonl
          head_repo=$(jq -r '.head.repo.full_name // empty' .moderation/pr.json)
          head_sha=$(jq -r '.head.sha' .moderation/pr.json)
          [ -n "$head_repo" ] || exit 0
          jq -r 'select(.status != "removed") | .filename' .moderation/files.jsonl \
            | grep -E '^(governance\.toml|(atlas|evidence|taxonomy)/[A-Za-z0-9._/-]+\.toml)$' | grep -v '\.\.' \
            | while read -r file; do
                mkdir -p ".moderation/head/$(dirname "$file")"
                gh api -H "Accept: application/vnd.github.raw+json" "repos/$head_repo/contents/$file?ref=$head_sha" \
                  > ".moderation/head/$file" || rm -f ".moderation/head/$file"
              done

      - name: Evaluate
        if: steps.pr.outputs.number != ''
        run: |
          python3 tools/moderation.py pr --dir .moderation
          cat .moderation/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          result=.moderation/result.json
          state=$(jq -r .state "$result")
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$(jq -r .head_sha "$result")" \
            -f state="$state" -f context=moderation -f description="$(jq -r .description "$result")" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          if [ "$(jq '.request | length' "$result")" -gt 0 ]; then
            jq '{reviewers: .request}' "$result" \
              | gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/requested_reviewers" --input - > /dev/null \
              || echo "::notice::Could not request reviews; GitHub only asks collaborators, so the comment mentions everyone."
          fi
          comment=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- moderation -->"))) | .id' | head -n 1)
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@.moderation/comment.md > /dev/null
          elif [ "$state" != "success" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -F body=@.moderation/comment.md > /dev/null
          fi
